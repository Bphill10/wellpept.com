    <path d="M980 140 C 1040 210, 1060 280, 1140 340" stroke-width="1" opacity="0.36"/>
    <path d="M280 560 C 340 620, 360 700, 430 760" stroke-width="1.1" opacity="0.34"/>
    <path d="M1020 540 C 1080 600, 1110 680, 1190 740" stroke-width="1" opacity="0.32"/>
    <path d="M560 920 C 620 980, 650 1060, 720 1120" stroke-width="1.1" opacity="0.36"/>
    <path d="M1280 900 C 1340 960, 1370 1040, 1450 1100" stroke-width="1" opacity="0.33"/>
    <path d="M820 380 C 860 430, 840 500, 890 560" stroke-width="0.9" opacity="0.3"/>
    <path d="M1480 300 C 1520 360, 1500 430, 1560 490" stroke-width="0.9" opacity="0.28"/>
    <path d="M400 780 C 450 830, 440 900, 500 950" stroke-width="0.95" opacity="0.3"/>
    <path d="M1680 640 C 1730 700, 1710 770, 1770 830" stroke-width="0.95" opacity="0.3"/>
