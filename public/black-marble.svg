    <circle cx="1760" cy="600" r="0.9" opacity="0.2"/>
    <circle cx="260" cy="860" r="1.1" opacity="0.24"/>
    <circle cx="590" cy="920" r="1" opacity="0.22"/>
    <circle cx="920" cy="840" r="1.2" opacity="0.26"/>
    <circle cx="1260" cy="900" r="0.9" opacity="0.2"/>
    <circle cx="1550" cy="830" r="1.1" opacity="0.24"/>
    <circle cx="1780" cy="920" r="1" opacity="0.22"/>
    <circle cx="340" cy="1120" r="1.1" opacity="0.24"/>
    <circle cx="680" cy="1060" r="1" opacity="0.22"/>
