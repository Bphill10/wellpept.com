<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="stone" x1="8%" y1="0%" x2="78%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="22%" stop-color="#0b0b0c"/>
      <stop offset="48%" stop-color="#040404"/>
      <stop offset="72%" stop-color="#0c0c0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="p1" cx="18%" cy="22%" r="46%">
      <stop offset="0%" stop-color="#1c1c1e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p2" cx="72%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#18181a" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p3" cx="42%" cy="78%" r="50%">
      <stop offset="0%" stop-color="#151517" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p4" cx="88%" cy="82%" r="36%">
      <stop offset="0%" stop-color="#1a1a1c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <rect width="1920" height="1280" fill="url(#stone)"/>
  <rect width="1920" height="1280" fill="url(#p1)"/>
  <rect width="1920" height="1280" fill="url(#p2)"/>
  <rect width="1920" height="1280" fill="url(#p3)"/>
  <rect width="1920" height="1280" fill="url(#p4)"/>

  <!-- Soft outer vein halos -->
