    <path d="M-40 780 C 210 700, 430 900, 700 770 C 940 660, 1160 920, 1450 790 C 1640 710, 1800 880, 2000 790" stroke-width="1.6" opacity="0.44"/>
    <path d="M-30 1140 C 250 1040, 480 1240, 760 1120 C 980 1030, 1220 1260, 1520 1130 C 1700 1050, 1840 1220, 2000 1140" stroke-width="1.8" opacity="0.5"/>

