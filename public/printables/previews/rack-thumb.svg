      <rect x="-9" y="120" width="18" height="34" rx="2" fill="#c8d8e6" opacity="0.4"/>
      <rect x="-11" y="78" width="22" height="12" rx="3" fill="#1a1a1a"/>
    </g>
    <g transform="translate(184,0)">
