<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="WellPept W monogram">
  <defs>
    <radialGradient id="disc" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#3a6fb5"/>
      <stop offset="45%" stop-color="#003d8f"/>
      <stop offset="82%" stop-color="#002456"/>
      <stop offset="100%" stop-color="#00122e"/>
    </radialGradient>
    <linearGradient id="carve" x1="64" y1="22" x2="64" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0ebe0"/>
      <stop offset="55%" stop-color="#ddd6c6"/>
      <stop offset="100%" stop-color="#b0a896"/>
    </linearGradient>
    <filter id="relief" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1.4" stdDeviation="0.7" flood-color="#001018" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="62" fill="url(#disc)"/>
  <circle cx="64" cy="64" r="57.5" fill="none" stroke="#8fa8c8" stroke-width="2" opacity="0.35"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="#c5d0e0" stroke-width="0.75" opacity="0.2"/>

  <!-- Bigger, bolder relic W — heavy stems, fills the medallion -->
  <g filter="url(#relief)">
    <path
      fill="url(#carve)"
      d="
        M 12 22
        L 36 22
        L 47 92
        L 54 38
        L 74 38
        L 81 92
        L 92 22
        L 116 22
        L 98 112
        L 76 112
        L 64 54
        L 52 112
        L 30 112
        Z
      "
    />
  </g>
</svg>
