<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="WellPept W monogram">
  <defs>
    <radialGradient id="disc" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#3a6fb5"/>
      <stop offset="45%" stop-color="#0047ab"/>
      <stop offset="82%" stop-color="#002f75"/>
      <stop offset="100%" stop-color="#00122e"/>
    </radialGradient>
  </defs>

  <circle cx="64" cy="64" r="62" fill="url(#disc)"/>
  <circle cx="64" cy="64" r="55" fill="none" stroke="#c5d0e0" stroke-width="1.25" opacity="0.35"/>

  <!--
    Classic crossed W: three peaks on one top line, diagonals meet at center.
    Kept inside the rim with clear cobalt margin.
  -->
  <path
    fill="#e8eef8"
    d="
      M 28 38
      L 39 38
      L 50 86
      L 64 38
      L 78 86
      L 89 38
      L 100 38
      L 84 98
      L 73 98
      L 64 66
      L 55 98
      L 44 98
      Z
    "
  />
</svg>
